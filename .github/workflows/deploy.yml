name: Deploy

# Preview on PRs, production on merges to master. The ordered stages live in deploy-environment.yml.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read
  packages: write # push the API image to GHCR
  id-token: write # Azure OIDC
  pull-requests: write # comment the preview URL

jobs:
  preview:
    # Preview shows the next PR to merge: one that targets master. A PR stacked on another branch skips
    # (otherwise every push in a stack would displace the pending run of the PR below it). Fork PRs get no
    # secrets, so they skip too. Any branch can still be deployed by hand with workflow_dispatch.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'preview') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.ref == 'master')
    # Every PR shares the preview stack, so runs queue rather than overlap; the last push wins. Set on the job,
    # not the workflow, so a run whose job skips (a stacked PR) never takes a place in the queue.
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: preview
    secrets: inherit

  production:
    # Off until production is provisioned (#55): set the PRODUCTION_ENABLED variable to true to turn it on.
    if: >-
      vars.PRODUCTION_ENABLED == 'true' &&
      ((github.event_name == 'push') ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && github.ref == 'refs/heads/master'))
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
    secrets: inherit
