name: Deploy

# One ordered deploy per environment: D1 migrations → Worker → API image → Container Apps revision
# (waits on /health) → Vercel. Each stage runs only if the one before it succeeded.
on:
  pull_request:
  workflow_dispatch:

# Every PR shares the preview stack, so runs queue rather than overlap. The last push wins.
concurrency:
  group: deploy-preview
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push the API image to GHCR
  id-token: write # Azure OIDC
  pull-requests: write # comment the preview URL

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  RESOURCE_GROUP: rg-stonelasley
  IMAGE: ghcr.io/${{ github.repository_owner }}/stonelasley-api

jobs:
  preview:
    name: Deploy to preview
    # Fork PRs get no secrets, so they can't deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    env:
      CONTAINER_APP: ca-stonelasley-api-preview
      CONTAINER_ENV: cae-stonelasley-preview
      WORKER_URL: https://data-preview.stonelasley.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Apply D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply DB --env preview --remote

      - name: Deploy the Worker
        working-directory: worker
        run: |
          printf '%s' "${{ secrets.PREVIEW_WORKER_SECRET }}" | npx wrangler secret put WORKER_SECRET --env preview
          npx wrangler deploy --env preview

      - name: Build and push the API image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:${{ github.sha }}" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} api
          docker push "$IMAGE:${{ github.sha }}"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the API revision
        id: api
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors
          secrets=(
            "worker-secret=${{ secrets.PREVIEW_WORKER_SECRET }}"
            "ingest-token=${{ secrets.PREVIEW_INGEST_TOKEN }}"
            "revalidate-secret=${{ secrets.PREVIEW_REVALIDATE_SECRET }}"
          )
          env_vars=(
            "Worker__BaseUrl=$WORKER_URL"
            "Worker__Secret=secretref:worker-secret"
            "Ingest__Token=secretref:ingest-token"
            "Revalidation__Secret=secretref:revalidate-secret"
            "Site__NoIndex=true"
          )
          if az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1; then
            az containerapp secret set -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --secrets "${secrets[@]}" --only-show-errors >/dev/null
            az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --image "$IMAGE:${{ github.sha }}" --set-env-vars "${env_vars[@]}" --only-show-errors >/dev/null
          else
            az containerapp create -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --environment "$CONTAINER_ENV" \
              --image "$IMAGE:${{ github.sha }}" --target-port 8080 --ingress external \
              --min-replicas 0 --max-replicas 1 --cpu 0.25 --memory 0.5Gi \
              --secrets "${secrets[@]}" --env-vars "${env_vars[@]}" --only-show-errors >/dev/null
          fi
          fqdn=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      - name: Wait for the API on /health
        run: node web/scripts/warm-api.mjs
        env:
          API_URL: ${{ steps.api.outputs.url }}

      - name: Build and deploy the site
        id: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          set -euo pipefail
          npx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx vercel@latest build --token="$VERCEL_TOKEN"
          url=$(npx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN" \
            --env API_URL="$API_URL" --env REVALIDATE_SECRET="${{ secrets.PREVIEW_REVALIDATE_SECRET }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The shared preview API revalidates whichever preview deployed last.
      - name: Point API revalidation at this deployment
        run: |
          az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
            --set-env-vars "Revalidation__Url=${{ steps.site.outputs.url }}/api/revalidate" --only-show-errors >/dev/null

      - name: Comment the preview URLs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body \
            "Preview for ${{ github.sha }}: site ${{ steps.site.outputs.url }} · API ${{ steps.api.outputs.url }}"
