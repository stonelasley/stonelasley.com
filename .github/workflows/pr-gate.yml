name: PR Gate

on:
  pull_request:
    branches:
      - master
      - main
  # Allow manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  quality-checks:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run TypeScript type checking
        run: npm run type-check

      - name: Run unit tests
        run: npm run test -- --run

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json

      - name: Restore .NET solution
        run: dotnet restore api/StoneLasley.slnx

      - name: Run .NET format check
        run: dotnet format whitespace api/StoneLasley.slnx --no-restore --verify-no-changes

      - name: Run .NET lint
        run: |
          dotnet format style api/StoneLasley.slnx --no-restore --verify-no-changes --severity warn
          dotnet format analyzers api/StoneLasley.slnx --no-restore --verify-no-changes --severity warn
          dotnet build api/StoneLasley.slnx --no-restore

      - name: Run .NET unit tests
        run: dotnet test api/tests/Domain.UnitTests --no-build

      # Starts the real Worker under `wrangler dev` with a throwaway local D1.
      - name: Run .NET functional tests
        run: dotnet test api/tests/Api.FunctionalTests --no-build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test -w e2e --json | jq -r '.dependencies.e2e.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx -w e2e playwright install chromium --with-deps

      # Starts the Worker, the API and `next start`, ingesting e2e/fixtures/content before the build.
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
