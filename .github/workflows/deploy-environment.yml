name: Deploy an environment

# One ordered deploy of one environment: D1 migrations → Worker → API image → Container Apps revision
# (waits on /health) → Vercel → smoke tests. Each stage runs only if the one before it succeeded. Called by
# deploy.yml; preview and production differ only in the names, URLs and secrets set below.
on:
  workflow_call:
    inputs:
      environment:
        description: preview or production
        type: string
        required: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  RESOURCE_GROUP: rg-stonelasley
  IMAGE: ghcr.io/${{ github.repository_owner }}/stonelasley-api
  PREVIEW: ${{ inputs.environment == 'preview' }}
  # Secrets are named PREVIEW_* and PRODUCTION_*.
  PREFIX: ${{ inputs.environment == 'preview' && 'PREVIEW' || 'PRODUCTION' }}
  CONTAINER_APP: ${{ inputs.environment == 'preview' && 'ca-stonelasley-api-preview' || 'ca-stonelasley-api-prod' }}
  CONTAINER_ENV: ${{ inputs.environment == 'preview' && 'cae-stonelasley-preview' || 'cae-stonelasley-prod' }}
  WORKER_URL: ${{ inputs.environment == 'preview' && 'https://data-preview.stonelasley.com' || 'https://data.stonelasley.com' }}
  IMAGES_URL: ${{ inputs.environment == 'preview' && 'https://img-preview.stonelasley.com/' || 'https://img.stonelasley.com/' }}
  # Production only; preview uses the Container App's own address and each deployment's URL.
  PUBLIC_API_URL: ${{ inputs.environment == 'production' && vars.PRODUCTION_API_URL || '' }}
  SITE_URL: ${{ inputs.environment == 'production' && vars.PRODUCTION_SITE_URL || '' }}
  # A production Vercel deploy takes over stonelasley.com at once, so production ships only the API and Worker
  # until PRODUCTION_SITE_ENABLED is true: content is ingested first, and the site switches over after.
  SHIP_SITE: ${{ inputs.environment == 'preview' || vars.PRODUCTION_SITE_ENABLED == 'true' }}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Apply D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply DB --env ${{ inputs.environment }} --remote

      - name: Deploy the Worker
        working-directory: worker
        env:
          WORKER_SECRET: ${{ secrets[format('{0}_WORKER_SECRET', env.PREFIX)] }}
        run: |
          printf '%s' "$WORKER_SECRET" | npx wrangler secret put WORKER_SECRET --env ${{ inputs.environment }}
          npx wrangler deploy --env ${{ inputs.environment }}

      - name: Build and push the API image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:${{ github.sha }}" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} api
          docker push "$IMAGE:${{ github.sha }}"

      # Previews sit behind Vercel Deployment Protection, so the API revalidates with the project's
      # "Protection Bypass for Automation" secret, generated here the first time. The smoke tests use it too.
      # Production isn't protected; sending the header there is harmless.
      - name: Get the Vercel automation bypass secret
        id: bypass
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          team=""; [[ "$VERCEL_ORG_ID" == team_* ]] && team="?teamId=$VERCEL_ORG_ID"
          api="https://api.vercel.com"
          auth=(-H "Authorization: Bearer $VERCEL_TOKEN")
          secret=$(curl -fsS "${auth[@]}" "$api/v9/projects/$VERCEL_PROJECT_ID$team" \
            | jq -r '.protectionBypass // {} | to_entries[] | select(.value.scope == "automation-bypass") | .key' | head -1)
          if [ -z "$secret" ]; then
            secret=$(curl -fsS -X PATCH "${auth[@]}" -H "Content-Type: application/json" -d '{}' \
              "$api/v1/projects/$VERCEL_PROJECT_ID/protection-bypass$team" \
              | jq -r '.protectionBypass | to_entries[] | select(.value.scope == "automation-bypass") | .key' | head -1)
          fi
          if [ -z "$secret" ]; then echo "::error::No Vercel automation bypass secret" && exit 1; fi
          echo "::add-mask::$secret"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the API revision
        id: api
        env:
          WORKER_SECRET: ${{ secrets[format('{0}_WORKER_SECRET', env.PREFIX)] }}
          INGEST_TOKEN: ${{ secrets[format('{0}_INGEST_TOKEN', env.PREFIX)] }}
          REVALIDATE_SECRET: ${{ secrets[format('{0}_REVALIDATE_SECRET', env.PREFIX)] }}
          VERCEL_BYPASS: ${{ steps.bypass.outputs.secret }}
          ADMIN_TOKEN: ${{ secrets[format('{0}_ADMIN_TOKEN', env.PREFIX)] }}
          SESSION_KEY: ${{ secrets[format('{0}_ACCESS_SESSION_KEY', env.PREFIX)] }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          # The API reads the index version the Worker binds as active (#44).
          INDEX_VERSION=$(node -e 'const t=require("fs").readFileSync("worker/wrangler.jsonc","utf8"); console.log(t.match(new RegExp(`"${process.argv[1]}"[\\s\\S]*?"ACTIVE_INDEX_VERSION":\\s*"([^"]+)"`))[1])' "${{ inputs.environment }}")
          az extension add --name containerapp --upgrade --only-show-errors
          secrets=(
            "worker-secret=$WORKER_SECRET"
            "ingest-token=$INGEST_TOKEN"
            "revalidate-secret=$REVALIDATE_SECRET"
            "vercel-bypass=$VERCEL_BYPASS"
            "admin-token=$ADMIN_TOKEN"
            "session-key=$SESSION_KEY"
            "turnstile-secret=$TURNSTILE_SECRET"
          )
          env_vars=(
            "Worker__BaseUrl=$WORKER_URL"
            "Worker__Secret=secretref:worker-secret"
            "Ingest__Token=secretref:ingest-token"
            "Revalidation__Secret=secretref:revalidate-secret"
            "Revalidation__ProtectionBypass=secretref:vercel-bypass"
            "Admin__Token=secretref:admin-token"
            "Access__SessionKey=secretref:session-key"
            "Turnstile__SecretKey=secretref:turnstile-secret"
            "Images__BaseUrl=$IMAGES_URL"
            "Site__NoIndex=$PREVIEW"
            "Site__ShowDrafts=$PREVIEW"
            "Search__Vector__IndexVersion=$INDEX_VERSION"
          )
          if az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1; then
            az containerapp secret set -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --secrets "${secrets[@]}" --only-show-errors >/dev/null
            az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --image "$IMAGE:${{ github.sha }}" --min-replicas 0 --max-replicas 1 \
              --set-env-vars "${env_vars[@]}" --only-show-errors >/dev/null
          else
            az containerapp create -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --environment "$CONTAINER_ENV" \
              --image "$IMAGE:${{ github.sha }}" --target-port 8080 --ingress external \
              --min-replicas 0 --max-replicas 1 --cpu 0.25 --memory 0.5Gi \
              --secrets "${secrets[@]}" --env-vars "${env_vars[@]}" --only-show-errors >/dev/null
          fi
          # The old revision answers /health until the new one is ready, and a site built against it can miss
          # fields the new API added. Single-revision mode moves traffic once the latest revision is ready.
          revision=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
          for _ in $(seq 60); do
            ready=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.latestReadyRevisionName -o tsv)
            [ "$ready" = "$revision" ] && break
            sleep 5
          done
          if [ "$ready" != "$revision" ]; then
            echo "::error::API revision $revision wasn't ready after 5 minutes (still serving $ready)."
            exit 1
          fi
          fqdn=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          # Production is reached on its custom domain (api.stonelasley.com) once one is bound.
          echo "url=${PUBLIC_API_URL:-https://$fqdn}" >> "$GITHUB_OUTPUT"

      - name: Wait for the API on /health
        run: node web/scripts/warm-api.mjs
        env:
          API_URL: ${{ steps.api.outputs.url }}

      # After a version bump, adopt the index re-index.yml built (404 when there's nothing to promote).
      - name: Promote a finished index build
        env:
          ADMIN_TOKEN: ${{ secrets[format('{0}_ADMIN_TOKEN', env.PREFIX)] }}
        run: |
          version=$(node -e 'const t=require("fs").readFileSync("worker/wrangler.jsonc","utf8"); console.log(t.match(new RegExp(`"${process.argv[1]}"[\\s\\S]*?"ACTIVE_INDEX_VERSION":\\s*"([^"]+)"`))[1])' "${{ inputs.environment }}")
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ steps.api.outputs.url }}/admin/vectors/promote?version=$version" -H "Authorization: Bearer $ADMIN_TOKEN")
          echo "promote $version: $status"
          [ "$status" = 204 ] || [ "$status" = 404 ]

      - name: Build and deploy the site
        if: env.SHIP_SITE == 'true'
        id: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Read by `vercel build` (prebuild warm-up and every prerendered page) and again at runtime.
          API_URL: ${{ steps.api.outputs.url }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          REVALIDATE_SECRET: ${{ secrets[format('{0}_REVALIDATE_SECRET', env.PREFIX)] }}
        run: |
          set -euo pipefail
          prod=(); [ "$PREVIEW" = true ] || prod=(--prod)
          npx vercel@latest pull --yes --environment=${{ inputs.environment }} --token="$VERCEL_TOKEN"
          npx vercel@latest build "${prod[@]}" --token="$VERCEL_TOKEN"
          # One archive rather than hundreds of files: the free plan caps uploads at 5,000 a day, and each
          # build changes most of its files, so a busy day of deploys otherwise hits it.
          url=$(npx vercel@latest deploy --prebuilt --archive=tgz "${prod[@]}" --token="$VERCEL_TOKEN" \
            --env API_URL="$API_URL" --env REVALIDATE_SECRET="$REVALIDATE_SECRET")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The shared preview API revalidates whichever preview deployed last; production revalidates the site's
      # own domain, since a deployment URL stops being production at the next deploy.
      - name: Point API revalidation at this deployment
        if: env.SHIP_SITE == 'true'
        id: target
        run: |
          url="${SITE_URL:-${{ steps.site.outputs.url }}}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --set-env-vars \
            "Revalidation__Url=$url/api/revalidate" --only-show-errors >/dev/null

      - name: Check the site revalidates through the API's path
        if: env.SHIP_SITE == 'true'
        env:
          BYPASS: ${{ steps.bypass.outputs.secret }}
          REVALIDATE_SECRET: ${{ secrets[format('{0}_REVALIDATE_SECRET', env.PREFIX)] }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            -H "x-vercel-protection-bypass: $BYPASS" "${{ steps.target.outputs.url }}/api/revalidate")
          echo "revalidate answered $status"
          test "$status" = 200

      - name: Install Playwright
        if: env.SHIP_SITE == 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Smoke-test the deployed site
        if: env.SHIP_SITE == 'true'
        working-directory: e2e
        env:
          SMOKE_URL: ${{ steps.target.outputs.url }}
          VERCEL_BYPASS: ${{ steps.bypass.outputs.secret }}
          SMOKE_EXPECT_INDEXED: ${{ env.PREVIEW == 'false' }}
        run: npm run test:smoke

      - name: Comment the preview URLs
        if: env.PREVIEW == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body \
            "Preview for ${{ github.sha }}: site ${{ steps.site.outputs.url }} · API ${{ steps.api.outputs.url }}"
